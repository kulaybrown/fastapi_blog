{% extends "layout.html" %}
{% block content %}
    {% for post in posts %}
        <article>
            <div>
                <img src="{{ post.author.image_path }}" alt="{{ post.author.username }}" width="50">
                <h2><a href="{{ url_for('get_post', post_id=post.id) }}">{{ post.title }}</a></h2>
                <p>{{ post.content }}</p>
                <p><a href="{{ url_for('user_posts', user_id=post.author.id) }}">Author: {{ post.author.username }}</a></p>
                <p>{{ post.date_posted }}</p>
            </div>
        </article>
    {% endfor %}
{% endblock content %}
