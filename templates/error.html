{% extends "layout.html" %}
{% block content %}
    <div class="flex items-center justify-center py-12 md:py-24">
        <div class="text-center max-w-md w-full bg-white rounded-2xl border border-slate-100 shadow-sm p-8 space-y-6">
            <!-- Icon Indicator -->
            <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-rose-50 text-rose-600 mb-2">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <!-- Error Title & Message -->
            <div class="space-y-2">
                <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight">{{ status_code }}</h1>
                <h2 class="text-xl font-bold text-slate-800">Something went wrong</h2>
                <p class="text-slate-500 text-sm leading-relaxed">
                    {{ message if message else "The page or resource you are looking for can't be found or is temporarily unavailable." }}
                </p>
            </div>

            <!-- Navigation Actions -->
            <div class="pt-4 border-t border-slate-50 flex flex-col sm:flex-row gap-3 items-center justify-center">
                <a href="{{ url_for('home') }}" class="w-full sm:w-auto inline-flex items-center justify-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 hover:shadow-md transition-all duration-200">
                    Go back home
                </a>
                <a href="javascript:history.back()" class="w-full sm:w-auto inline-flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors">
                    Previous page
                </a>
            </div>
        </div>
    </div>
{% endblock content %}
