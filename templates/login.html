{% extends "layout.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh] px-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-100 shadow-xl p-8 space-y-6">
        <!-- Tab Headers -->
        <div class="flex border-b border-slate-100">
            <button id="loginTab" onclick="switchTab('login')" class="flex-1 pb-4 text-center font-bold text-lg border-b-2 transition-all duration-200 focus:outline-none">
                Sign In
            </button>
            <button id="registerTab" onclick="switchTab('register')" class="flex-1 pb-4 text-center font-bold text-lg border-b-2 transition-all duration-200 focus:outline-none">
                Register
            </button>
        </div>

        <!-- Alert messages -->
        {% if error %}
        <div id="errorMessage" class="p-4 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-600 flex items-start gap-2.5">
            <svg class="h-5 w-5 text-rose-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Sign In Form -->
        <form id="loginForm" action="/login" method="POST" class="space-y-4">
            <div class="space-y-1">
                <label for="login_username" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" name="username" id="login_username" placeholder="Type your username..." required value="{% if active_tab == 'login' %}{{ username or '' }}{% endif %}"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-slate-800 placeholder-slate-400">
                </div>
            </div>

            <button type="submit" class="w-full inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-3.5 text-sm font-semibold text-white shadow-md hover:bg-blue-500 hover:shadow-lg transition-all duration-200">
                Sign In
            </button>
            <p class="text-center text-xs text-slate-400 pt-2">
                Don't have an account? <a href="#" onclick="switchTab('register'); return false;" class="text-blue-600 font-semibold hover:underline">Register here</a>.
            </p>
        </form>

        <!-- Register Form -->
        <form id="registerForm" action="/register" method="POST" class="hidden space-y-4">
            <div class="space-y-1">
                <label for="register_username" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" name="username" id="register_username" placeholder="Choose a username..." required value="{% if active_tab == 'register' %}{{ username or '' }}{% endif %}"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-slate-800 placeholder-slate-400">
                </div>
            </div>

            <div class="space-y-1">
                <label for="register_email" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </span>
                    <input type="email" name="email" id="register_email" placeholder="you@example.com" required value="{% if active_tab == 'register' %}{{ email or '' }}{% endif %}"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-all text-slate-800 placeholder-slate-400">
                </div>
            </div>

            <button type="submit" class="w-full inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3.5 text-sm font-semibold text-white shadow-md hover:bg-indigo-500 hover:shadow-lg transition-all duration-200">
                Create Account & Sign In
            </button>
            <p class="text-center text-xs text-slate-400 pt-2">
                Already have an account? <a href="#" onclick="switchTab('login'); return false;" class="text-indigo-600 font-semibold hover:underline">Sign in here</a>.
            </p>
        </form>
    </div>
</div>

<script>
    function switchTab(tab) {
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        if (tab === 'login') {
            // Set Tab active classes
            loginTab.classList.add('border-blue-600', 'text-blue-600');
            loginTab.classList.remove('border-transparent', 'text-slate-400');
            registerTab.classList.add('border-transparent', 'text-slate-400');
            registerTab.classList.remove('border-blue-600', 'text-blue-600', 'border-indigo-600', 'text-indigo-600');

            // Toggle forms
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        } else {
            // Set Tab active classes
            registerTab.classList.add('border-indigo-600', 'text-indigo-600');
            registerTab.classList.remove('border-transparent', 'text-slate-400');
            loginTab.classList.add('border-transparent', 'text-slate-400');
            loginTab.classList.remove('border-blue-600', 'text-blue-600', 'border-indigo-600', 'text-indigo-600');

            // Toggle forms
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        }
    }

    // Initialize the default/active tab based on backend suggestion
    document.addEventListener("DOMContentLoaded", function() {
        const activeTab = "{{ active_tab or 'login' }}";
        switchTab(activeTab);
    });
</script>
{% endblock content %}
