{% block navigation %}
<header class="sticky top-0 z-50 w-full border-b border-slate-200/80 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/60">
    <div class="container mx-auto px-4 max-w-4xl h-16 flex items-center justify-between">
        <!-- Logo / Brand Signature -->
        <a href="{{ url_for('home') }}" class="flex items-center gap-2 group">
            <svg class="h-6 w-6 text-blue-600 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                <line x1="4" y1="22" x2="4" y2="15"/>
            </svg>
            <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                FastAPI Blog
            </span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="flex items-center gap-6">
            <a href="{{ url_for('home') }}" class="text-slate-600 hover:text-blue-600 font-medium text-sm transition-colors relative py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-blue-600 after:transition-all after:duration-200">
                Home
            </a>
            <a href="{{ url_for('posts') }}" class="text-slate-600 hover:text-blue-600 font-medium text-sm transition-colors relative py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-blue-600 after:transition-all after:duration-200">
                Posts
            </a>
            <a href="/docs" class="text-slate-600 hover:text-blue-600 font-medium text-sm transition-colors relative py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 hover:after:w-full after:bg-blue-600 after:transition-all after:duration-200">
                API Docs
            </a>
            
            {% if request.state.user %}
                <div class="flex items-center gap-4 border-l border-slate-200 pl-4">
                    <a href="{{ url_for('user_posts', user_id=request.state.user.id) }}" class="flex items-center gap-2 group/user">
                        <img src="{{ request.state.user.image_path }}" alt="{{ request.state.user.username }}" class="h-8 w-8 rounded-full object-cover ring-2 ring-blue-50 group-hover/user:ring-blue-200 transition-all">
                        <span class="text-sm font-semibold text-slate-700 group-hover/user:text-blue-600 transition-colors">
                            {{ request.state.user.username }}
                        </span>
                    </a>
                    <a href="/logout" class="inline-flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 px-3.5 py-1.5 text-xs font-semibold text-slate-700 shadow-sm transition-all duration-200">
                        Logout
                    </a>
                </div>
            {% else %}
                <div class="flex items-center gap-4 border-l border-slate-200 pl-4">
                    <a href="/login" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 hover:shadow transition-all duration-200 font-medium">
                        Sign In
                    </a>
                </div>
            {% endif %}
        </nav>
    </div>
</header>
{% endblock navigation %}
